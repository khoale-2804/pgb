services:
  paradedb:
    image: paradedb/paradedb:0.25.9
    container_name: pgb-paradedb
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  # non-search lane on the newest beta; start with: docker compose --profile pg19 up -d
  pg19:
    image: postgres:19beta3
    container_name: pgb-pg19
    profiles: ["pg19"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"
